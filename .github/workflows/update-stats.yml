name: Update game stats
on:
  schedule: [{cron: '17 */3 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/sync-games.mjs
      - name: Commit changes
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet || (git commit -m "Update game stats" && git push)
